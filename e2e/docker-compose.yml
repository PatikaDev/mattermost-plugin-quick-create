# Throwaway Mattermost for the end-to-end tests. MM_VERSION picks the server line
# (e.g. 11.7.11 = React 18, 12.0.0 = React 19); the same plugin build must pass on both.
name: quick-create-e2e
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: mmuser
      POSTGRES_PASSWORD: mmuser
      POSTGRES_DB: mattermost
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmuser -d mattermost"]
      interval: 5s
      retries: 30
  mattermost:
    image: mattermost/mattermost-team-edition:${MM_VERSION:-11.7.11}
    platform: linux/amd64
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["8067:8065"]
    environment:
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: "postgres://mmuser:mmuser@postgres:5432/mattermost?sslmode=disable"
      MM_SERVICESETTINGS_SITEURL: "http://localhost:8067"
      MM_SERVICESETTINGS_ENABLELOCALMODE: "true"
      MM_PLUGINSETTINGS_ENABLE: "true"
      MM_PLUGINSETTINGS_ENABLEUPLOADS: "true"
      MM_TEAMSETTINGS_ENABLEOPENSERVER: "true"
